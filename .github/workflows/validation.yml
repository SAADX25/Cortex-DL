name: Production validation
on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run version:verify
      - run: npm run test:release
      - run: npm run engines:stage
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:integration
      - name: Run all tests
        run: |
          New-Item -ItemType Directory -Force -Path smoke-results | Out-Null
          npm test 2>&1 | Tee-Object -FilePath smoke-results/tests.log
          exit $LASTEXITCODE
      - if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/verify-release.cjs --release
      - run: npm run build
      - run: npm run test:installer
      - run: npm run release:verify
      - run: node scripts/license-gate.cjs
      - name: Upload validated installer files
        uses: actions/upload-artifact@v6
        with:
          name: windows-validation
          path: |
            app/release/*/*.exe
            app/release/*/*.blockmap
            app/release/*/latest.yml
          if-no-files-found: error
      - name: Upload validation diagnostics
        uses: actions/upload-artifact@v6
        if: ${{ !cancelled() }}
        with:
          name: windows-diagnostics
          path: app/smoke-results/
          if-no-files-found: ignore
  release:
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    if: startsWith(github.ref, 'refs/tags/')
    needs: windows
    runs-on: windows-latest
    environment: production-release
    permissions:
      contents: write
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v7
        with:
          name: windows-validation
          path: app/release
      - shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/release-tags.cjs verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $tag = "v$version"
          if ($tag -cne $env:GITHUB_REF_NAME) { throw 'Tag does not match the package version.' }
          $publishedTags = @(gh api "repos/$env:GITHUB_REPOSITORY/releases" --paginate --jq '.[].tag_name')
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify existing releases. Publication stopped.' }
          if ($publishedTags -ccontains $tag) { throw "$tag is already published. Use a new version; existing releases are immutable." }
          gh release create "$tag" "release/$version/Cortex-DL-Setup-$version.exe" "release/$version/Cortex-DL-Setup-$version.exe.blockmap" "release/$version/latest.yml" --verify-tag --generate-notes --latest --title "Cortex DL v$version"
